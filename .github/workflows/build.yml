name: Build APK dari ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip
        run: unzip -q jalanan-tenggarong.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dan siapkan Android
        working-directory: jalanan-tenggarong
        run: |
          npm install
          npx cap add android
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml || true
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: Build APK
        working-directory: jalanan-tenggarong/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jalanan-Tenggarong-APK
          path: jalanan-tenggarong/android/app/build/outputs/apk/debug/app-debug.apk
